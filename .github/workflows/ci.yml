name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Tests that call the OpenAI API are marked live and excluded by default.
      - name: Test
        run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BenefitsIntelligence.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/BenefitsIntelligence.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false
