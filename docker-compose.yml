services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # $$ defers expansion to the container so the password stays out of the compose config.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Application services run only with `--profile app`, so a plain `docker compose up` gives just
  # the infrastructure for running the API and worker from the IDE without competing consumers.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/BenefitsIntelligence.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BenefitsIntelligence: "Server=mssql,1433;Database=BenefitsIntelligence;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      DocumentStorage__RootPath: /data
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    volumes:
      - documents:/data
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: src/python
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DOCUMENT_ROOT: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
    volumes:
      - documents:/data:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
  mssql-data:
  documents:
