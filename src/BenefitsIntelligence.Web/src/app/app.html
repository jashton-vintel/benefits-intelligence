<header class="container">
  <div class="app-header">
    <a class="brand" routerLink="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="10" />
        <path d="M11 8h7l5 5v11a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" class="page" />
        <path d="M12.5 18.5l2.5 2.5 5-5" class="tick" />
      </svg>
      <span class="brand-name">Benefits Intelligence</span>
    </a>
    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Policies</a
      >
      <a class="button plain" routerLink="/policies/new">Upload policy</a>
    </nav>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="container">
  <p>Every extracted value is traced to the page and passage it came from.</p>
</footer>
