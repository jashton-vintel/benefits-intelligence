[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benefits-intelligence-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.1.0",
    "ftfy>=6.3.1",
    "pydantic-settings>=2.6",
    "pymupdf>=1.28.2",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "markdown>=3.11",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
policy-worker = "app.workers.policy_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
